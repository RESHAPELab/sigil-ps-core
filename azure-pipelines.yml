trigger:
  branches:
    include:
      - feat-*
      - CAT-prompt

pr: none

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'
  dspyModel: 'openai/gpt-5-mini'
  dspyMaxCompletionTokens: '2048'
  testContainerAppName: 'sigil-api-cat-test'
  prodContainerAppName: 'sigil-api-cat'
  testDatabaseName: 'sigil_cat_test'
  prodDatabaseName: 'sigil_cat_production'

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: BuildAndPush
    displayName: Build and Push
    pool:
      name: local
    steps:
    - task: Docker@2
      inputs:
        repository: 'sigil-api'
        containerRegistry: 'SIGIL-PS ACR'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(tag)

- stage: Test
  displayName: Deploy Test
  condition: succeeded()
  jobs:
  - deployment: DeployTestContainerApp
    environment: 'Test'
    displayName: Deploy to Test Container App
    pool:
      name: local
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureKeyVault@2
            inputs:
              azureSubscription: 'Azure for Students Subscription'
              KeyVaultName: 'reshapelab-sigil-ps'
              SecretsFilter: '*'
              RunAsPreJob: true
          - task: AzureContainerApps@1
            inputs:
              azureSubscription: 'Azure for Students Subscription'
              acrName: 'reshapelab'
              acrUsername: 'reshapelab'
              acrPassword: '$(ACR-Password)'
              imageToDeploy: 'reshapelab.azurecr.io/sigil-api:$(tag)'
              containerAppName: '$(testContainerAppName)'
              resourceGroup: 'reshapelab'
              containerAppEnvironment: 'Test'
              targetPort: '80'
              ingress: 'external'
              environmentVariables: 'OPENAI_API_KEY=$(OpenAI-API-Key-Test) DSPY_MODEL=$(dspyModel) DSPY_MAX_COMPLETION_TOKENS=$(dspyMaxCompletionTokens) MYSQL_HOST=$(MySQL-Host) MYSQL_DATABASE=$(testDatabaseName) MYSQL_USER=$(MySQL-User) MYSQL_PASSWORD=$(MySQL-Password) MAX_HISTORY=10'

- stage: Production
  displayName: Deploy Production
  condition: succeeded()
  jobs:
  - deployment: DeployProdContainerApp
    environment: 'Production'
    displayName: Deploy to Prod Container App
    pool:
      name: local
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureKeyVault@2
            inputs:
              azureSubscription: 'Azure for Students Subscription'
              KeyVaultName: 'reshapelab-sigil-ps'
              SecretsFilter: '*'
              RunAsPreJob: true
          - task: AzureContainerApps@1
            inputs:
              azureSubscription: 'Azure for Students Subscription'
              acrName: 'reshapelab'
              acrUsername: 'reshapelab'
              acrPassword: '$(ACR-Password)'
              imageToDeploy: 'reshapelab.azurecr.io/sigil-api:$(tag)'
              containerAppName: '$(prodContainerAppName)'
              resourceGroup: 'reshapelab'
              containerAppEnvironment: 'Test'
              targetPort: '80'
              ingress: 'external'
              environmentVariables: 'OPENAI_API_KEY=$(OpenAI-API-Key) DSPY_MODEL=$(dspyModel) DSPY_MAX_COMPLETION_TOKENS=$(dspyMaxCompletionTokens) MYSQL_HOST=$(MySQL-Host) MYSQL_DATABASE=$(prodDatabaseName) MYSQL_USER=$(MySQL-User) MYSQL_PASSWORD=$(MySQL-Password) MAX_HISTORY=10'
